[alembic]
script_location = alembic
prepend_sys_path = . src
version_path_separator = os

# The URL is resolved from shopping_backend.core.config (env/.env) in alembic/env.py;
# setting sqlalchemy.url here would hard-code one dialect, which is exactly what
# docs/EXTENSION_DB_DOCKER.md exists to avoid.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
